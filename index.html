<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITDL · IzzoP Team Demon List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Все стили такие же как в предыдущей версии */
        :root {
            --bg-body: #0b0d15;
            --bg-surface: #1a1e2b;
            --bg-surface2: #141926;
            --bg-input: #10131f;
            --bg-table-alt: #11161f;
            --bg-hover: #2d3555;
            --border-color: #2c324a;
            --border-light: #3d445e;
            --text-primary: #e8edf5;
            --text-secondary: #b0bedd;
            --text-muted: #5d6a8f;
            --text-inverse: #0b0d15;
            --accent: #ff7eb3;
            --accent-hover: #ff5177;
            --shadow: rgba(0, 0, 0, 0.6);
            --btn-bg: #2f3650;
            --btn-border: #3f4668;
            --badge-bg: #2a3150;
            --danger: #c73b4b;
            --danger-hover: #b02c3c;
            --success: #2b8c5e;
            --success-hover: #1f734b;
            --input-border: #323a57;
            --toast-bg: #1f263b;
            --toast-border: #ff7eb3;
            --table-header: #1b212f;
            --table-border: #1e253b;
            --gradient-start: #ff7eb3;
            --gradient-end: #ff758c;
            --card-bg: #181e2d;
            --victor-bg: #1f263b;
            --thumbnail-bg: #0f121e;
            --notification-bg: #1f263b;
            --notification-hover: #2d3555;
            --notification-border: #3d445e;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }
        /* ... остальные стили из предыдущей версии ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-surface);
            border-radius: 32px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px var(--shadow);
            border: 1px solid var(--border-color);
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .logo i {
            -webkit-text-fill-color: var(--accent);
            margin-right: 8px;
        }
        .logo-sub {
            font-size: 14px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            margin-left: 6px;
            font-weight: 400;
        }
        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            padding: 8px 18px;
            border-radius: 40px;
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--text-inverse);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }
        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-light);
        }
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 40px;
            background: var(--bg-surface2);
            border: 1px solid var(--border-color);
        }
        .sync-status.synced i { color: var(--success); }
        .sync-status.syncing i { color: var(--accent); animation: spin 1s linear infinite; }
        .sync-status.error i { color: var(--danger); }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 20px;
            background: var(--bg-table-alt);
            padding: 4px;
            border: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th {
            text-align: left;
            padding: 16px 12px;
            background: var(--table-header);
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--table-border);
        }
        td {
            padding: 12px 12px;
            border-bottom: 1px solid var(--table-border);
            vertical-align: middle;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--toast-bg);
            padding: 14px 24px;
            border-radius: 60px;
            border-left: 6px solid var(--toast-border);
            box-shadow: 0 12px 30px var(--shadow);
            z-index: 999;
            transition: opacity 0.3s;
        }
        .toast.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .admin-panel {
            background: var(--bg-surface2);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: flex-end;
        }
        .form-group {
            flex: 1 0 150px;
            min-width: 130px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid var(--input-border);
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .level-page {
            display: none;
            background: var(--bg-surface2);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .level-page.active {
            display: block;
        }
        .leaderboard-page {
            display: none;
            background: var(--bg-surface2);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .leaderboard-page.active {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--bg-surface);
            border-radius: 32px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow);
            position: relative;
        }
        .modal .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
        }
        .video-thumb {
            width: 120px;
            height: 68px;
            border-radius: 12px;
            background: var(--thumbnail-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
        }
        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-thumb .play-icon {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
        }
        .td-thumb {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .victor-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .victor-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--victor-bg);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <header class="header">
            <div class="logo" id="goHomeBtn">
                <i class="fas fa-skull"></i> ITDL
                <span class="logo-sub">(izzoPTeamDemonList)</span>
            </div>
            <div class="header-controls">
                <button class="btn active" id="navLevelsBtn"><i class="fas fa-list"></i> Уровни</button>
                <button class="btn" id="navLeaderboardBtn"><i class="fas fa-trophy"></i> Лидерборд</button>
                <input type="text" id="loginInput" placeholder="Логин" style="padding:8px 14px;border-radius:40px;border:1px solid var(--input-border);background:var(--bg-input);color:var(--text-primary);outline:none;width:140px;">
                <input type="password" id="passInput" placeholder="Пароль" style="padding:8px 14px;border-radius:40px;border:1px solid var(--input-border);background:var(--bg-input);color:var(--text-primary);outline:none;width:140px;">
                <button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Вход</button>
                <button class="btn btn-outline" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> Выйти</button>
                <div class="sync-status" id="syncStatus">
                    <i class="fas fa-cloud"></i>
                    <span id="syncStatusText">Загрузка...</span>
                </div>
            </div>
        </header>

        <!-- Упрощенная админ-панель -->
        <div class="admin-panel" id="adminPanel" style="display:none;">
            <h3><i class="fas fa-crown"></i> Админ-панель</h3>
            <div class="form-row">
                <div class="form-group"><label>Название</label><input type="text" id="levelName" placeholder="Название"></div>
                <div class="form-group"><label>Автор</label><input type="text" id="levelAuthor" placeholder="Автор"></div>
                <div class="form-group"><label>Позиция</label><input type="number" id="levelPosition" placeholder="1"></div>
                <div class="form-group"><label>Видео</label><input type="text" id="levelVideo" placeholder="YouTube ссылка"></div>
                <button class="btn btn-success" id="addLevelBtn"><i class="fas fa-plus"></i> Добавить</button>
                <button class="btn btn-outline" id="syncBtn"><i class="fas fa-sync"></i> Синхр.</button>
            </div>
        </div>

        <!-- Главная таблица -->
        <div id="mainView">
            <div class="table-wrap">
                <table>
                    <thead><tr><th>#</th><th>Уровень</th><th>Автор</th><th>Баллы</th><th>Действия</th></tr></thead>
                    <tbody id="levelTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Страница уровня -->
        <div class="level-page" id="levelPage">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                <div>
                    <h2 id="lpName">Название</h2>
                    <div id="lpAuthor">Автор</div>
                </div>
                <div>
                    <span class="btn" id="lpPoints">0 points</span>
                    <button class="btn btn-outline" id="closeLevelPage"><i class="fas fa-arrow-left"></i> Назад</button>
                </div>
            </div>
            <div class="victors-section" style="margin-top:20px;">
                <h4>Викторы</h4>
                <div class="victor-list" id="victorList"></div>
            </div>
        </div>

        <!-- Лидерборд -->
        <div class="leaderboard-page" id="leaderboardPage">
            <h2><i class="fas fa-trophy"></i> Лидерборд</h2>
            <div id="leaderboardList"></div>
        </div>

        <div class="footer" style="margin-top:30px;color:var(--text-muted);text-align:center;">
            ITDL · Лидерборд по очкам
        </div>
    </div>

    <div id="toast" class="toast hidden">Уведомление</div>

    <script>
    (function() {
        "use strict";

        // ============================================
        // 1. КОНФИГУРАЦИЯ GITHUB (ЗАМЕНИТЕ НА СВОИ ДАННЫЕ)
        // ============================================
        const GITHUB_CONFIG = {
            owner: 'Nikita130212',        // <-- Ваш ник на GitHub
            repo: 'izzoPTeamList',        // <-- Название репозитория
            token: 'github_pat_11BQOPK4A0uFv8yMm4TQHX_3s4V9pL5qR7wX2yZ1aBcDeFgHiJkLmNoPqRsTuVwX', // <-- Ваш токен
            issueNumber: 1 // <-- Номер Issue
        };

        // ============================================
        // 2. БАЗА ДАННЫХ
        // ============================================
        let levels = [];
        let users = [];
        let currentUser = null;
        let isAdmin = false;
        let currentLevelId = null;
        let currentView = 'levels';

        // ============================================
        // 3. РАБОТА С GITHUB
        // ============================================
        class GitHubDB {
            constructor(config) {
                this.config = config;
                this.apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/issues/${config.issueNumber}`;
                this.headers = {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                };
            }

            async load() {
                try {
                    const response = await fetch(this.apiUrl, { headers: this.headers });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return JSON.parse(data.body || '{}');
                } catch (e) {
                    console.error('GitHub load error:', e);
                    return null;
                }
            }

            async save(data) {
                try {
                    const body = JSON.stringify(data, null, 2);
                    const response = await fetch(this.apiUrl, {
                        method: 'PATCH',
                        headers: { ...this.headers, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ body })
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json();
                } catch (e) {
                    console.error('GitHub save error:', e);
                    return null;
                }
            }
        }

        const db = new GitHubDB(GITHUB_CONFIG);
        let isSyncing = false;

        // ============================================
        // 4. РАБОТА С LOCALSTORAGE (КЭШ)
        // ============================================
        function saveToCache(data) {
            try {
                localStorage.setItem('itdl_cache', JSON.stringify(data));
            } catch (e) {}
        }

        function loadFromCache() {
            try {
                const data = localStorage.getItem('itdl_cache');
                return data ? JSON.parse(data) : null;
            } catch (e) { return null; }
        }

        // ============================================
        // 5. ЗАГРУЗКА/СОХРАНЕНИЕ ДАННЫХ
        // ============================================
        function getDefaultData() {
            return {
                levels: [
                    { id: 1, name: 'foggy morning', author: 'NikSupchik', position: 1,
                        video: 'https://www.youtube.com/watch?v=0zL5rYV0mE8', victors: [{name: 'NikSupchik', video: 'https://www.youtube.com/watch?v=0zL5rYV0mE8'}] },
                    { id: 2, name: 'Bloodbath', author: 'Riot', position: 2,
                        video: 'https://www.youtube.com/watch?v=7hJvG9nRZvo', victors: [{name: 'Riot', video: ''}] },
                    { id: 3, name: 'Sonic Wave', author: 'Cyclic', position: 3,
                        video: 'https://youtu.be/k7rJ3k6t7UQ', victors: [{name: 'Cyclic', video: ''}] },
                    { id: 4, name: 'Cataclysm', author: 'Ggb0y', position: 4, video: '', victors: [] },
                    { id: 5, name: 'Aftermath', author: 'Kaba', position: 5, video: '', victors: [] },
                ],
                users: [
                    { username: 'admin', password: '123', isAdmin: true },
                    { username: 'NikSupchik', password: '123', isAdmin: false },
                    { username: 'Riot', password: '123', isAdmin: false },
                ],
                notifications: []
            };
        }

        async function loadData() {
            updateSyncStatus('syncing', 'Загрузка...');
            
            let data = await db.load();
            
            if (data) {
                // Успешно загружено с GitHub
                levels = data.levels || [];
                users = data.users || [];
                saveToCache(data);
                updateSyncStatus('synced', 'Синхронизировано');
            } else {
                // Пробуем загрузить из кэша
                const cached = loadFromCache();
                if (cached) {
                    levels = cached.levels || [];
                    users = cached.users || [];
                    updateSyncStatus('error', 'Офлайн режим');
                    showToast('⚠️ Работаем в офлайн режиме');
                } else {
                    // Создаем данные по умолчанию
                    const def = getDefaultData();
                    levels = def.levels;
                    users = def.users;
                    saveToCache(def);
                    updateSyncStatus('error', 'Нет данных');
                    showToast('📝 Созданы данные по умолчанию');
                }
            }

            // Проверяем сессию
            const sessionUser = localStorage.getItem('itdl_session');
            if (sessionUser) {
                const found = users.find(u => u.username === sessionUser);
                if (found) {
                    currentUser = sessionUser;
                    isAdmin = found.isAdmin || false;
                }
            }

            renderAll();
            updateAuthUI();
        }

        async function saveData() {
            const data = { levels, users, notifications: [] };
            
            // Сохраняем в кэш всегда
            saveToCache(data);
            
            // Пробуем сохранить на GitHub
            if (!isSyncing) {
                isSyncing = true;
                updateSyncStatus('syncing', 'Сохранение...');
                
                const result = await db.save(data);
                
                if (result) {
                    updateSyncStatus('synced', 'Синхронизировано');
                } else {
                    updateSyncStatus('error', 'Ошибка синхронизации');
                    showToast('⚠️ Данные сохранены локально');
                }
                
                isSyncing = false;
            }

            renderAll();
        }

        async function syncData() {
            if (isSyncing) return;
            await loadData();
            showToast('✅ Данные синхронизированы');
        }

        // ============================================
        // 6. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        function calculatePoints(position) {
            const map = {1:300, 2:270, 3:245, 4:225, 5:210, 6:195, 7:180, 8:165, 9:150, 10:135, 11:120};
            return map[position] !== undefined ? map[position] : Math.max(120 - (position - 11) * 5, 0);
        }

        function genId(arr) {
            return arr.length ? Math.max(...arr.map(i => i.id)) + 1 : 1;
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            let m = url.match(/embed\/([a-zA-Z0-9_-]{11})/);
            if (m) return m[1];
            m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
            if (m) return m[1];
            m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
            if (m) return m[1];
            if (url.match(/^[a-zA-Z0-9_-]{11}$/)) return url;
            return null;
        }

        function toEmbedUrl(url) {
            const id = extractYouTubeId(url);
            return id ? `https://www.youtube.com/embed/${id}` : null;
        }

        function getThumbnail(url) {
            const id = extractYouTubeId(url);
            return id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : null;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.add('hidden'), 3000);
        }

        function updateSyncStatus(status, text) {
            const el = document.getElementById('syncStatus');
            el.className = 'sync-status ' + status;
            document.getElementById('syncStatusText').textContent = text;
        }

        // ============================================
        // 7. UI ОБНОВЛЕНИЯ
        // ============================================
        function updateAuthUI() {
            document.getElementById('loginBtn').style.display = currentUser ? 'none' : 'inline-flex';
            document.getElementById('logoutBtn').style.display = currentUser ? 'inline-flex' : 'none';
            document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
            
            if (currentUser) {
                document.getElementById('loginInput').value = '';
                document.getElementById('passInput').value = '';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('levelTableBody');
            const sorted = [...levels].sort((a, b) => a.position - b.position);
            
            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">Нет уровней</td></tr>`;
                return;
            }

            let html = '';
            sorted.forEach(level => {
                const thumb = getThumbnail(level.video);
                const points = calculatePoints(level.position);
                
                html += `<tr>
                    <td><span style="background:var(--badge-bg);padding:4px 12px;border-radius:40px;">${level.position}</span></td>
                    <td>
                        <div class="td-thumb">
                            <div class="video-thumb" data-id="${level.id}">
                                ${thumb ? `<img src="${thumb}" loading="lazy"><i class="fas fa-play play-icon"></i>` : '<i class="fas fa-video-slash" style="color:var(--text-muted);font-size:22px;"></i>'}
                            </div>
                            <span class="level-name" data-id="${level.id}" style="cursor:pointer;font-weight:600;">${escapeHtml(level.name)}</span>
                        </div>
                    </td>
                    <td>${escapeHtml(level.author)}</td>
                    <td><span style="background:var(--badge-bg);padding:4px 12px;border-radius:40px;color:var(--gold);">${points}</span></td>
                    <td>
                        ${isAdmin ? `
                            <button class="btn btn-sm" onclick="window.moveLevel(${level.id}, -1)"><i class="fas fa-arrow-up"></i></button>
                            <button class="btn btn-sm" onclick="window.moveLevel(${level.id}, 1)"><i class="fas fa-arrow-down"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="window.deleteLevel(${level.id})"><i class="fas fa-trash"></i></button>
                        ` : ''}
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;

            // Клик по уровню
            document.querySelectorAll('.level-name, .video-thumb').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id || this.closest('[data-id]')?.dataset.id;
                    if (id) openLevelPage(parseInt(id));
                });
            });
        }

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            const sortedUsers = users
                .filter(u => !u.isAdmin)
                .map(u => ({
                    username: u.username,
                    points: levels.filter(l => l.victors?.find(v => v.name === u.username))
                        .reduce((sum, l) => sum + calculatePoints(l.position), 0),
                    count: levels.filter(l => l.victors?.find(v => v.name === u.username)).length
                }))
                .sort((a, b) => b.points - a.points);

            if (sortedUsers.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Нет игроков</div>';
                return;
            }

            let html = '';
            sortedUsers.forEach((u, i) => {
                const rank = i + 1;
                const cls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
                html += `<div style="display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;background:var(--bg-surface);border:1px solid var(--border-color);margin-bottom:8px;cursor:pointer;" data-username="${u.username}">
                    <span style="font-weight:700;font-size:18px;min-width:40px;color:${cls === 'gold' ? 'var(--gold)' : cls === 'silver' ? 'var(--silver)' : cls === 'bronze' ? 'var(--bronze)' : 'var(--text-muted)'};">#${rank}</span>
                    <span style="font-weight:600;flex:1;">${escapeHtml(u.username)}</span>
                    <span style="font-weight:700;color:var(--gold);">${u.points} очков</span>
                    <span style="font-size:13px;color:var(--text-muted);">${u.count} уровней</span>
                </div>`;
            });
            list.innerHTML = html;

            document.querySelectorAll('[data-username]').forEach(el => {
                el.addEventListener('click', function() {
                    showToast(`👤 ${this.dataset.username}: профиль в разработке`);
                });
            });
        }

        function openLevelPage(id) {
            const level = levels.find(l => l.id === id);
            if (!level) return;
            
            currentLevelId = id;
            document.getElementById('lpName').textContent = level.name;
            document.getElementById('lpAuthor').textContent = `Автор: ${level.author}`;
            document.getElementById('lpPoints').textContent = `${calculatePoints(level.position)} points`;

            // Викторы
            const list = document.getElementById('victorList');
            if (!level.victors || level.victors.length === 0) {
                list.innerHTML = '<span style="color:var(--text-muted);">Нет викторов</span>';
            } else {
                list.innerHTML = level.victors.map(v => 
                    `<div class="victor-item"><i class="fas fa-trophy"></i> ${escapeHtml(v.name)}</div>`
                ).join('');
            }

            document.getElementById('mainView').style.display = 'none';
            document.getElementById('leaderboardPage').classList.remove('active');
            document.getElementById('levelPage').classList.add('active');
        }

        function closeLevelPage() {
            document.getElementById('mainView').style.display = 'block';
            document.getElementById('levelPage').classList.remove('active');
            currentLevelId = null;
            if (currentView === 'leaderboard') {
                document.getElementById('mainView').style.display = 'none';
                document.getElementById('leaderboardPage').style.display = 'block';
                document.getElementById('leaderboardPage').classList.add('active');
            }
        }

        function renderAll() {
            renderTable();
            renderLeaderboard();
            if (currentLevelId) {
                const level = levels.find(l => l.id === currentLevelId);
                if (level) {
                    document.getElementById('lpName').textContent = level.name;
                    document.getElementById('lpAuthor').textContent = `Автор: ${level.author}`;
                    document.getElementById('lpPoints').textContent = `${calculatePoints(level.position)} points`;
                }
            }
        }

        // ============================================
        // 8. CRUD ОПЕРАЦИИ
        // ============================================
        window.addLevel = function() {
            const name = document.getElementById('levelName').value.trim();
            const author = document.getElementById('levelAuthor').value.trim();
            const position = parseInt(document.getElementById('levelPosition').value);
            const video = document.getElementById('levelVideo').value.trim();

            if (!name || !author) { showToast('Заполните название и автора'); return; }
            if (isNaN(position) || position < 1) { showToast('Позиция >= 1'); return; }
            if (levels.some(l => l.position === position)) { showToast(`Позиция ${position} занята`); return; }

            levels.push({ id: genId(levels), name, author, position, video, victors: [] });
            saveData();
            showToast(`✅ "${name}" добавлен`);
            document.getElementById('levelName').value = '';
            document.getElementById('levelAuthor').value = '';
            document.getElementById('levelPosition').value = '';
            document.getElementById('levelVideo').value = '';
        };

        window.deleteLevel = function(id) {
            if (!isAdmin) return;
            const level = levels.find(l => l.id === id);
            if (!level || !confirm(`Удалить "${level.name}"?`)) return;
            levels = levels.filter(l => l.id !== id);
            saveData();
            showToast(`🗑️ "${level.name}" удалён`);
            if (currentLevelId === id) closeLevelPage();
        };

        window.moveLevel = function(id, direction) {
            if (!isAdmin) return;
            const idx = levels.findIndex(l => l.id === id);
            if (idx === -1) return;
            const targetPos = levels[idx].position + direction;
            const targetIdx = levels.findIndex(l => l.position === targetPos);
            if (targetIdx === -1) { showToast('Нет уровня для обмена'); return; }
            [levels[idx].position, levels[targetIdx].position] = [levels[targetIdx].position, levels[idx].position];
            saveData();
            showToast('🔄 Позиция обновлена');
        };

        // ============================================
        // 9. АВТОРИЗАЦИЯ
        // ============================================
        function login(username, password) {
            const user = users.find(u => u.username === username && u.password === password);
            if (!user) { showToast('❌ Неверный логин или пароль'); return; }
            currentUser = username;
            isAdmin = user.isAdmin || false;
            localStorage.setItem('itdl_session', username);
            updateAuthUI();
            renderAll();
            showToast(`👋 Добро пожаловать, ${username}!`);
        }

        function logout() {
            currentUser = null;
            isAdmin = false;
            localStorage.removeItem('itdl_session');
            updateAuthUI();
            renderAll();
            showToast('👋 Вы вышли');
        }

        // ============================================
        // 10. НАВИГАЦИЯ
        // ============================================
        function switchView(view) {
            if (document.getElementById('levelPage').classList.contains('active')) return;
            currentView = view;
            document.getElementById('navLevelsBtn').classList.toggle('active', view === 'levels');
            document.getElementById('navLeaderboardBtn').classList.toggle('active', view === 'leaderboard');
            
            if (view === 'levels') {
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('leaderboardPage').style.display = 'none';
                document.getElementById('leaderboardPage').classList.remove('active');
            } else {
                document.getElementById('mainView').style.display = 'none';
                document.getElementById('leaderboardPage').style.display = 'block';
                document.getElementById('leaderboardPage').classList.add('active');
                renderLeaderboard();
            }
        }

        // ============================================
        // 11. ИНИЦИАЛИЗАЦИЯ
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Кнопки
            document.getElementById('loginBtn').addEventListener('click', () => 
                login(document.getElementById('loginInput').value.trim(), document.getElementById('passInput').value.trim())
            );
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('addLevelBtn').addEventListener('click', window.addLevel);
            document.getElementById('syncBtn').addEventListener('click', syncData);
            document.getElementById('navLevelsBtn').addEventListener('click', () => switchView('levels'));
            document.getElementById('navLeaderboardBtn').addEventListener('click', () => switchView('leaderboard'));
            document.getElementById('closeLevelPage').addEventListener('click', closeLevelPage);
            document.getElementById('goHomeBtn').addEventListener('click', closeLevelPage);

            // Enter для входа
            document.getElementById('loginInput').addEventListener('keydown', e => {
                if (e.key === 'Enter') document.getElementById('passInput').focus();
            });
            document.getElementById('passInput').addEventListener('keydown', e => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });

            // Загружаем данные
            loadData();
        });

        // Экспортируем для onclick
        window.moveLevel = window.moveLevel;
        window.deleteLevel = window.deleteLevel;

        console.log('🚀 ITDL запущен!');
        console.log('📌 Настройте GITHUB_CONFIG в начале скрипта');
        console.log('🔑 Используйте admin/123 для входа');
    })();
    </script>
</body>
</html>
